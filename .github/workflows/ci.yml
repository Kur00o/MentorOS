name: CI
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mentoros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Tests (SQLite)
        run: python -m pytest backend/tests -q
      - name: Tests (Postgres)
        env: { TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mentoros_test" }
        run: python -m pytest backend/tests -q
      - name: Migrations apply cleanly
        env: { ALEMBIC_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mentoros_test" }
        run: |
          psql postgresql://postgres:postgres@localhost:5432/mentoros_test -c "drop schema public cascade; create schema public"
          python -m alembic -c backend/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
